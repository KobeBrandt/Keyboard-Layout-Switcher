name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default; only the release job may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/KeyboardLayoutSwitcher.Tests -c Release

      - name: Publish
        shell: bash
        run: |
          # Take the version from the tag (v1.2.3 -> 1.2.3); other builds keep the version in the project file.
          version_arg=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version_arg="-p:Version=${GITHUB_REF_NAME#v}"
          fi
          # Self-contained: users need no .NET runtime, only this one exe.
          dotnet publish KeyboardLayoutSwitcher.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true $version_arg -o publish

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KeyboardLayoutSwitcher
          path: publish/KeyboardLayoutSwitcher.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: KeyboardLayoutSwitcher
          path: publish

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Keyboard Layout Switcher ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: publish/KeyboardLayoutSwitcher.exe
